modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "portion_fluids"
version = "${file.jarVersion}"
displayName = "定量倒液"
description = '''
工作台里用流体容器的配方只扣固定的一份液体，并把容器还回来。
允许陶壶的配方扣 100 mB，必须用木桶或铁桶的配方扣 1000 mB。
群峦是硬依赖。Firmalife 没装也能用，装了会同样处理它的合成。
'''

[[dependencies.portion_fluids]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.portion_fluids]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.portion_fluids]]
modId = "tfc"
mandatory = true
versionRange = "[3.2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.portion_fluids]]
modId = "firmalife"
mandatory = false
versionRange = "[2,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "portionfluids.mixins.json"
